kind: vslices-document-definition
version: 0.1

document:
  type: consistency
  scopes:
    - domain-context
    - business-scenario
    - work-line
    - process
    - workflow
    - flow
    - feature
    - capability
    - product
    - service
    - project
    - organization
    - system
    - application
    - component
    - module
    - operation
    - integration

  question:
    id: consistency
    text: ¿Qué debe mantenerse coherente?
    children:
      - id: consistency-unit
        text: ¿Qué elementos deben considerarse en conjunto?
        children:
          - id: participating-elements
            text: ¿Qué elementos participan?
          - id: preserved-relationship
            text: ¿Qué relación entre ellos debe preservarse?
          - id: independent-change
            text: ¿Qué puede cambiar independientemente?
          - id: joint-change
            text: ¿Qué cambios requieren considerar al conjunto?
          - id: consistency-boundary
            text: ¿Dónde termina esta unidad de consistencia?

      - id: invariants
        text: ¿Qué debe mantenerse verdadero?
        children:
          - id: valid-states
            text: ¿Qué estados son válidos?
          - id: invalid-state-combinations
            text: ¿Qué combinaciones de estados son inválidas?
          - id: preserved-relations
            text: ¿Qué relaciones deben preservarse?
          - id: corresponding-values
            text: ¿Qué valores deben corresponder?
          - id: uniqueness
            text: ¿Qué unicidades deben mantenerse?
          - id: preserved-order
            text: ¿Qué orden debe preservarse?
          - id: never-valid-condition
            text: ¿Qué condición nunca debería observarse como válida?

      - id: consistency-rules
        text: ¿Qué reglas sostienen esta consistencia?
        children:
          - id: rule-identity
            text: ¿Qué regla estamos describiendo?
          - id: protected-by-rule
            text: ¿Qué protege?
          - id: rule-dependencies
            text: ¿De qué otras reglas depende?
          - id: independent-evaluation
            text: ¿Puede evaluarse independientemente?
          - id: jointly-meaningful-rules
            text: ¿Qué reglas sólo tienen sentido en conjunto?

      - id: applicability
        text: ¿Cuándo debe mantenerse esta consistencia?
        children:
          - id: applicable-situations
            text: ¿En qué situaciones aplica?
          - id: applicable-states
            text: ¿En qué estados aplica?
          - id: activating-changes
            text: ¿Qué cambios activan su necesidad?
          - id: non-applicable-conditions
            text: ¿Cuándo no aplica?
          - id: explicit-exceptions
            text: ¿Qué excepciones explícitas existen?

      - id: temporal-consistency
        text: ¿Cuándo debe existir la consistencia?
        children:
          - id: continuous-consistency
            text: ¿Debe mantenerse continuamente?
          - id: before-change
            text: ¿Debe cumplirse antes de un cambio?
          - id: after-change
            text: ¿Debe cumplirse al terminar un cambio?
          - id: temporary-inconsistency
            text: ¿Puede existir inconsistencia temporal?
          - id: tolerated-inconsistency-window
            text: ¿Durante cuánto tiempo puede tolerarse?
          - id: restoration-deadline
            text: ¿Cuándo debe haberse restaurado?

      - id: observers
        text: ¿Quién necesita observar un estado consistente?
        children:
          - id: observing-participants
            text: ¿Qué participantes observan esta unidad?
          - id: shared-observed-state
            text: ¿Deben observar todos el mismo estado?
          - id: stale-observation
            text: ¿Puede algún observador ver estado atrasado?
          - id: tolerated-temporal-differences
            text: ¿Qué diferencias temporales son tolerables?
          - id: semantically-invalid-observation
            text: ¿Qué observación sería semánticamente inválida?

      - id: affecting-changes
        text: ¿Qué cambios pueden afectar esta consistencia?
        children:
          - id: modifying-operations
            text: ¿Qué operaciones modifican los elementos protegidos?
          - id: jointly-evaluated-changes
            text: ¿Qué cambios necesitan evaluarse conjuntamente?
          - id: independently-occurring-changes
            text: ¿Qué cambios pueden ocurrir independientemente?
          - id: concurrent-changes
            text: ¿Pueden existir cambios concurrentes?
          - id: boundary-crossing-changes
            text: ¿Qué cambios atraviesan la frontera de consistencia?

      - id: change-authority
        text: ¿Quién tiene autoridad para modificar el estado coherente?
        children:
          - id: change-initiators
            text: ¿Quién puede iniciar cambios?
          - id: validity-authority
            text: ¿Quién decide si el cambio es válido?
          - id: single-authority
            text: ¿Existe una única autoridad?
          - id: coordinated-authorities
            text: ¿Existen autoridades coordinadas?
          - id: partial-change-without-authority
            text: ¿Puede alguien modificar una parte sin autoridad sobre el conjunto?

      - id: consistency-recognition
        text: ¿Cómo reconocemos que la consistencia se mantiene?
        children:
          - id: observable-conditions
            text: ¿Qué condiciones deben observarse?
          - id: matching-relations
            text: ¿Qué relaciones deben coincidir?
          - id: sufficient-evidence-states
            text: ¿Qué estados son evidencia suficiente?
          - id: insufficient-observation
            text: ¿Qué observación no basta?
          - id: false-consistency
            text: ¿Qué podría parecer consistente sin serlo?

      - id: inconsistency
        text: ¿Qué constituye una inconsistencia?
        children:
          - id: violated-rule
            text: ¿Qué regla deja de cumplirse?
          - id: incompatible-coexisting-states
            text: ¿Qué estados incompatibles pueden coexistir?
          - id: broken-relationship
            text: ¿Qué relación deja de sostenerse?
          - id: revealing-observation
            text: ¿Qué observación la revela?
          - id: partial-inconsistency
            text: ¿Puede existir inconsistencia parcial?

      - id: consistency-importance
        text: ¿Por qué importa preservar esta consistencia?
        children:
          - id: lost-meaning
            text: ¿Qué significado se pierde si se rompe?
          - id: unreliable-behavior
            text: ¿Qué comportamiento deja de ser confiable?
          - id: invalid-state-decisions
            text: ¿Qué decisiones quedarían basadas en estado inválido?
          - id: dependent-guarantees
            text: ¿Qué otras garantías dependen de ella?

      - id: competing-changes
        text: ¿Qué ocurre cuando varios cambios compiten?
        children:
          - id: simultaneous-changes
            text: ¿Pueden ocurrir simultáneamente?
          - id: conflicting-changes
            text: ¿Qué cambios pueden entrar en conflicto?
          - id: prevailing-state
            text: ¿Qué estado debe prevalecer?
          - id: conflict-recognition
            text: ¿Cómo reconocemos el conflicto?
          - id: preserved-after-conflict
            text: ¿Qué debe seguir siendo verdadero después?

      - id: consistency-recovery
        text: ¿Cómo debe recuperarse la consistencia?
        children:
          - id: restored-condition
            text: ¿Qué condición debe volver a cumplirse?
          - id: reconciliation-information
            text: ¿Qué información permite reconciliar estados?
          - id: acceptable-final-state
            text: ¿Qué estado final es aceptable?
          - id: multiple-valid-final-states
            text: ¿Puede haber varios estados finales válidos?

      - id: assumptions
        text: ¿Qué estamos asumiendo para que esta consistencia sea válida?
        children:
          - id: supporting-assumption
            text: ¿Qué supuesto sostiene la regla?
          - id: assumption-dependent-part
            text: ¿Qué parte depende de él?
          - id: supporting-evidence
            text: ¿Qué evidencia lo sostiene?
          - id: falsification-impact
            text: ¿Qué cambiaría si fuera falso?
